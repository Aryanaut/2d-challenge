# lite3_explorer mission manager. Every key here overrides mission/config.py DEFAULTS; unlisted keys keep
# their defaults. Any key is accepted (the node auto-declares parameters), so new modes, traversal profiles and
# end-condition settings can be added here without code changes.
# ROS 2 can't type an empty list: write [''] for "none".
mission_manager:
  ros__parameters:
    global_frame: map
    robot_frame: base_link
    map_topic: /map
    global_costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    output_dir: "~/lite3_survey_runs"        # run_<time>/events.jsonl, tiles.json, AI images
    reports_dir: "~/2d/reports"    # tile_report_<run>.md
    scene_images_dir: "~/2d/images/runs"     # scene tile images sent to the AI: <dir>/<run>/scene_<tile>_q<n>.jpg (+ .json answer)
    slam_jump_m: 0.5                         # map->odom moving more than this / slam_jump_deg in 0.2 s = SLAM jump (loop
    slam_jump_deg: 15.0                      # closure), not motion: 'slam_jump' event, and no tile counts as reached for
    slam_jump_hold_s: 5.0                    # slam_jump_hold_s after it (0 m = off). fullrun_25_11_215528: false closure, 2.1 m
    use_ai: true                             # AI tile descriptions (lite3_llm_tools llm_client)
    llm_report_timeout_s: 180.0
    llm_report_retries: 5
    robot_length_m: 0.67                     # turn-room check; match the local costmap footprint
    robot_width_m: 0.37

    tiles:
      size_m: 1.0
      reach_radius_m: 0.30                   # a tile is explored once the robot is this close to its centre
      max_failures: 2                        # failed attempts (Nav2 abort, stuck, timeout) before a tile is unreachable
      min_known: 0.6                         # a tile exists once this share of it is scanned (was 0.7: the 1.7 m lidar range left edge tiles unknown)
      scene_min_known: 0.55                  # scene tile (drawn blue hatched in RViz): scanned at least this much ...
                                             # (26 Nov bags: cluttered tiles at known 0.55-0.61 / free 0.45-0.75 were missed at 0.65)
                                             # (fullrun 25 Nov 21:55: kitchen on -1,0 hides its own back, known stalled
                                             # at 0.81-0.84 with free/known 0.56-0.72 and the tile was entered; 0.80 flags it)
      scene_max_free: 0.90                   # ... and less than this share of the SCANNED part traversable (free/known)
                                             # (26 Nov: cleaning room 0,2 and 2,0 read 0.87, just under 0.88; plain tiles 0.89-1.0,
                                             # so above 0.90 many ordinary tiles get an AI look)
                                             # (reporter4 25 Nov: sink + bins on 0,-1 read 0.87 and were entered at 0.86;
                                             # ordinary tiles read 0.87-1.0, a false scene only costs one AI look)
      scene_lidar_min_known: 0.80            # ... but scanned less than this: a scene only with a scene-prop sighting on it
                                             # (fullrun_26_11_141104: 11 tiles flagged, 1 real; outside-maze tiles beside the
                                             # start read 0.55-0.70 scanned / free 0.5-0.8). 0 = off. Runtime:
                                             #   ros2 param set /mission_manager tiles.scene_lidar_min_known 0.0
      initial_clear_m: 0.40                  # the initial tile is closed (walled off) only once the robot is this far outside it
      no_curtain_on_initial_tile: false      # true: curtain spots on the initial tile's edges are ignored (false: explorer_26_11_223230,
                                             # the curtain was the start tile's W edge, right in front of the robot)
      align_on_entry: true                   # every tile entry: nudge the grid so that tile's edges lie on the detected walls ...
      align_max_shift_m: 0.15                # ... (an edge further than this from its wall is left alone)
      align_max_rot_deg: 6.0                 # ... (turn at most this much towards the wall angle)
      align_radius_m: 2.0
      align_min_quality: 1.5
      scene_margin_m: 0.10                   # ... free/known taken this far inside the tile edges: walls of a dead-end on a grid a few
                                             # cm off them are no scene (curtaintest 25 Nov: empty 2,0 read 0.85 whole, 0.98 inside)
      stair_min_points: 4                    # confirmed stair cells (10 cm, /stairs/points) that make a tile a staircase tile
      stair_floor_min_known: 0.90            # traversable tiles are never staircases (the steps stand at their edge): walked on,
      stair_floor_min_free: 0.95             # AI-called traversable, or scanned >= this much with >= this share of the interior free
      stair_shift_max_m: 0.35                # stair cells this close inside a traversable tile's edge (ascent out through it) count
                                             # for the tile beyond it; deeper ones are dropped
      roller_min_points: 4                   # confirmed roller spots (10 cm, /roller/points) that make a tile a roller tile ...
      roller_min_lidar: 2                    # ... of which this many the 3D lidar confirms (low returns only, open behind; 0 = depth alone)
      roller_depth_only_points: 12           # ... or a tile with this many spots needs no lidar (a long, well-seen ridge; 0 = lidar always required)
      roller_edge_margin_m: 0.15             # spots this close to a tile edge do not count (the roller lies across the middle)
      # scene-prop votes: the detector's scene props (food, utensils, cart ...) placed on the lidar map by bearing.
      # A tile with enough of them stays a scene tile (never entered) even when the lidar test drops it or the AI says
      # 'traversable' (fullrun 26 Nov: market 2,1 and kitchen 0,-1 had 50-100 sightings each; terrain 3,1 had none).
      # Needs the detector running (explorer.sh --reporter). Switch at runtime:
      #   ros2 param set /mission_manager tiles.prop_votes false
      prop_votes: true
      prop_min_frames: 5                     # sightings on the tile ...
      prop_min_score: 2.8                    # ... and their summed confidence (was 8 / 4.0, then 5 / 2.5)
                                             # (scripts/propvote_replay.py, 26 Nov: the cleaning trolley, seen as 'medical_kit',
                                             # got 5 / 2.5 in debug_the_scene_not_detecting (missed at 2.8) and 5 / 2.8 in
                                             # blockedscenetest3 (right at the limit); the robot walked into the room both times.
                                             # 2.8 keeps terrain 3,1 of an earlier fullrun (5 / 2.7) out: a prop scene cannot be
                                             # reopened by the AI)
      # detector labels that count as scene props. The label itself does not matter (the model mixes them up: the market
      # stall reads as medical_kit, the toy kitchen as food); a sighting only says "a prop is on this tile".
      # medical_kit included: it fires mostly on scene props (and once on a black post with a red base: fullrun 26 Nov)
      prop_labels: [tool_bench, hand_tools, kitchen, utensils, market_stall, cart, food, cleaning_cart, medical_kit]
      # chosen-tile check: the tile the exploration picks as its target is run against these scene-prop sightings; ANY on
      # it -> a scene tile (the scene mode looks at it from beside), never driven into. Below the prop_votes limit, so
      # unlike a prop-vote tile an AI 'traversable' answer reopens it. Raise min_frames if stray sightings close tiles.
      chosen_prop_check: true
      chosen_prop_min_frames: 1              # sightings on the chosen tile ...
      chosen_prop_min_score: 0.0             # ... and their summed confidence

    # ---------------------------------------------------------------- mission manager
    mission:
      modes: [idle, scanning, exploring, quickscan, curtain, curtain_scan, stairs, roller, scene, mppi, backtracking, recovery, ending, complete]   # instances to build (configured under modes.<name>)
      initial_mode: idle
      start_mode: scanning                   # set_active(true) / auto start goes here
      recovery_mode: recovery                # the stuck supervisor sends the robot here
      complete_mode: complete

    # ---------------------------------------------------------------- stuck supervisor
    # Stuck while unexplored tiles remain -> recovery_mode (drive to the nearest previously explored tile centre, then rescan).
    stuck:
      enabled: true
      watch_modes: [exploring, backtracking]
      triggers: [no_motion, costmap]
      window_s: 5.0                         # no_motion: driving this long (only a long unresponsive spell counts) ...
      min_motion_m: 0.15                     # ... and moving less than this
      costmap_cost: 99                       # costmap: robot centre on a global-costmap cell >= this (99 inscribed, 100 lethal)
      costmap_hold_s: 20.0                   # ... for this long
      cooldown_s: 5.0                        # grace period after entering a watched mode
      costmap_mode: mppi                     # stuck in the costmap obstacle zone -> this mode moves the robot out with x / y velocity ('' = recovery)
      per_mode:                              # overrides of costmap_hold_s / cooldown_s while that mode runs
        backtracking:
          # blockedscenetest3_26_11_092119: in the costmap for the whole backtrack, but every attempt (5 s cooldown,
          # 15 s align timeout, 5 s no_motion) ended in a failing recovery before the 20 s hold: the mppi nudge never ran
          costmap_hold_s: 4.0

    # ---------------------------------------------------------------- end condition
    # combine: any = finish when one condition is met; all = when every one is.
    # Built in: all_tiles_explored, no_frontiers_left (checked at each exploring decision), time_limit,
    # max_tiles_visited (checked continuously), ending_tile (checked at each exploring decision).
    end_condition:
      combine: any
      # TEMP: end condition disabled (time_limit with seconds 0 is never met; an empty list is rejected at startup).
      # Restore: conditions: [ending_tile, all_tiles_explored]
      conditions: [time_limit]                        # e.g. [all_tiles_explored, time_limit]
      all_tiles_explored:
        min_visited: 1
        ignore_unreachable: false            # false: tiles given up on still count as unexplored, so the mission does not finish
                                             #        until they are visited (they are retried every retry_period_s)
      time_limit:
        seconds: 0.0                         # 0 = off
      max_tiles_visited:
        count: 0                             # 0 = off
      ending_tile:                           # next_tile: the scan from the current tile shows the tile next to it with no
                                             # walls (outside the maze): the CURRENT tile is the ENDING tile; the robot centres
                                             # on it and the mission ends without leaving the maze.
                                             # open_tile (safety net): the robot ENTERED a tile with no walls: the tile before
                                             # it on its route with exactly 2 walls is the ending tile; it drives back there.
        triggers: [next_tile, open_tile]     # add hallway for >= min_hallway_tiles in a row
        min_seen_share: 0.5                  # next_tile: every edge of the next tile mapped (wall + free) along this share of
                                             # it, so an edge the scan has not reached does not pass as open (bag 25 Nov, 2,0
                                             # seen from 1,0: 0.50-1.00)
        min_hallway_tiles: 4                 # (hallway trigger only)
        entered_only: true                   # open_tile: only tiles the robot stood in: the 1.7 m lidar cannot see a far tile's edges
        solid_wall_share: 0.4                # "no walls" = no edge with mapped wall along this share of it or more: any wall
                                             # detected on an edge (maze wall or clutter) rules the tile out. 0.4 = the tiles'
                                             # wall / open classification; an open edge reads <= ~0.25 (wall ends at its
                                             # corners). 0 = every side must read open.
                                             # The INITIAL tile is never the ending tile.
        preceding: true                      # false: the entered open tile itself is the ending tile
        walls: 2                             # walls the ending tile has on its edges
        reach_radius_m: 0.30                 # met when the robot is this close to the ending tile's centre
        lock: true                           # keep the first ending tile found (until a new map)
        mode: ending
      no_frontiers_left:                     # use with frontier exploration: [all_tiles_explored, no_frontiers_left], combine: all
        min_cluster_cells: 8
        min_clearance_m: 0.30

    # ---------------------------------------------------------------- exploration profiles
    # WHERE to go next. type = a registered strategy (tiles, frontier; add your own in code).
    # modes.exploring.exploration lists the profiles to try, in order: later ones are fallbacks.
    explorations:
      tiles:
        type: tiles
        max_adjacency: 2                     # the next tile must touch an explored tile:
                                             #   0 open side with the current tile, 1 open side with any visited tile,
                                             #   2 any side (also across a wall) with a visited tile, 3 no requirement
        neighbours_only: true                # choose only among tiles sharing a side with the current tile; the others are marked irrelevant (tile 'relevant': false)
        neighbours_fallback: true            # ... but with no such tile left (dead end) offer the others, so the mission cannot stall (false: wait / recover)
        fallback_any: false                  # true: no tile within max_adjacency -> offer non-adjacent tiles too (they were picked while the neighbours were only transiently 'no path'); false: retry/recover instead
        reject_via_other_tiles: true         # drop a tile whose Nav2 path runs through any tile other than the current one and itself
        via_tile_tolerance_m: 0.15           # a path point counts as inside another tile only when this far past its border
        direct_path_only: true               # next tile = a neighbour of the current tile, reached by a path through their shared side
        direct_fallback: true                # none qualifies (dead end, backtracking) -> any reachable tile (else none)
        prefer_current: true                 # rank the current tile's neighbours before other visited tiles' neighbours
        eliminate_after: 2                   # failed Nav2 path checks in a row before a tile is eliminated (0 = never)
        candidate_limit: 12                  # tiles path-checked per decision
        target_limit: 6
        min_clearance_m: 0.30                # tiles with no point this far from walls are eliminated
      frontier:                              # OPTIONAL: add it to modes.exploring.exploration to use it
        type: frontier
        min_cluster_cells: 8
        goal_clearance_m: 0.35
        min_clearance_m: 0.30
        distance_weight: 1.0                 # cost = distance_weight * Nav2 path length - size_weight * frontier size
        size_weight: 0.5
        min_goal_distance_m: 0.6
        blacklist_radius_m: 0.6              # failed frontier goals are blacklisted
        candidate_limit: 8
        target_limit: 6
        replan_when_explored: true           # drop the goal once its frontier got mapped on the way
        explored_radius_m: 0.5

    # ---------------------------------------------------------------- traversal profiles
    # HOW to drive. type = a registered traversal (nav2_route, nav2_pose; add your own in code).
    traversals:
      route:                                 # NavigateThroughPoses: one path through the waypoints to the tile centre, no stops in between
        type: nav2_route
        backend: through_poses               # through_poses = drive through the waypoints without stopping; follow_waypoints = old FollowWaypoints (stops at each)
        route_mode: straight                 # straight = waypoints on the straight line current tile centre -> next tile centre; path = along the Nav2 path
        waypoints: 3                         # intermediate waypoints, evenly spaced along the path (driven through)
        skip_start_m: 0.0                      # 0 = equal gaps start->waypoints->tile centre; >0 skips that much of the path first (longer first gap)
        max_waypoint_deviation_m: 0.25       # drop waypoints further than this off the straight line start -> tile centre (0 = keep all)
        drop_backward_waypoints: false       # true: drop waypoints facing away from the goal (then fewer than 3)
      direct:                                # straight NavigateToPose
        type: nav2_pose
        behavior_tree: ""                    # '' = Nav2's default tree
      recovery_mppi:                         # recovery: NavigateToPose with the holonomic RecoveryMPPI controller (vx, vy, wz)
        type: nav2_pose
        behavior_tree: recovery_mppi.xml     # behavior_trees/ of this package: FollowPath controller_id="RecoveryMPPI"
      omni:                                  # recovery fallback, no Nav2: straight linear x / y velocity, heading held
        type: omni
        speed_mps: 0.1
        min_speed_mps: 0.06                  # speed = gain * distance, between these two
        gain: 0.8
        tolerance_m: 0.10                    # done this close to the tile centre
        heading_kp: 1.5                      # wz P-controller holding the starting heading
        wz_max: 0.3
        lead_s: 0.6                          # distance / heading taken this far ahead (the dog answers late and coasts on)
        heading_latch_s: 0.8                 # hold the heading it has after this long (still coasting from Nav2 before that)
        block_cost: 100                      # fail when a global-costmap cell this costly (lethal: wall / virtual wall) ...
        lookahead_m: 0.30                    # ... lies under the BODY rectangle this far ahead on the way (cells already under it are ignored)
        body_length_m: 0.61                  # footprint swept along the way (the heading is held, so it keeps the starting yaw)
        body_width_m: 0.37
        body_pad_m: 0.03
        timeout_s: 15.0
        stall_s: 6.0                         # fail when not min_progress_m closer within this long
        min_progress_m: 0.05
      # stairs:                              # example slot for a future stair traversal
      #   type: stairs

    # ---------------------------------------------------------------- modes
    modes:
      idle:
        type: idle
        auto_start: true                     # start by itself once TF / Nav2 / AI are up ...
        start_wait_s: 60.0                   # ... or after this long anyway
      scanning:
        type: scanning
        turn: true
        turn_deg: 80.0
        opening_setpoints_deg: [0, 80, -80]   # opening spin: yaw setpoints relative to the starting heading (flat gait), swept through the front only, then back to 0
        opening_retries: 2                  # the opening scan must finish: retry the sweep (alternating sides) this often
        opening_min_turn_deg: 45            # the opening spin always runs; it may stop early (map no longer sparse) only after turning this far
        return_tolerance_deg: 3.0            # after the opening sweep, turn back to the starting heading (within this)
        time_allowance_s: 7.0
        spin_lead_deg: 6.0                   # Nav2 Spin asks for this much less: the dog coasts 7-10 deg past (fullrun_26_11_210206)
        use_crawl: false                     # true: crawl gait while turning; false: scan turns (after the opening spin) keep the current gait
        settle_s: 2.0
        check_room: true                     # skip the turn where the body would hit the local costmap
        map_wait_s: 5.0
        next_mode: exploring
      exploring:
        type: exploring
        exploration: [tiles]                 # WHERE: profiles tried in order, e.g. [tiles, frontier]
        traversal: route                     # HOW: default traversal profile
        kind_traversals: ['']                # per target kind "kind:profile", e.g. ["frontier:direct"]
        tile_traversals: ['']                # per-tile overrides "i,j:profile", e.g. ["3,1:stairs"]
        path_check_timeout_s: 10.0
        goal_timeout_s: 10.0
        scan_after_reach: true
        scenes: true                         # a scene tile shares a side with the current tile -> scene mode (face it, AI describes it, mark explored; never entered)
        scene_mode: scene
        curtains: false                      # use_curtains:=true (launch / explorer.sh --curtains): a curtain on the current tile's edge -> curtain mode
        curtain_edge_tol_m: 0.30             # curtain spots within this of the tile edge line count as on the edge
        curtain_min_span_m: 0.40             # ... spread over at least this much of it
        curtain_camera_tol_m: 0.15           # the camera spots that confirm an edge lie within this of its line ...
        curtain_camera_min_span_m: 0.30      # ... and by themselves spread over this much of it (3 spots in a 9 cm patch = a misdetection on a wall)
        curtain_min_camera_spots: 3          # the curtain is confirmed against an edge by this many CAMERA spots on it (depth hem / colour);
                                             # the edge with the most wins. Once the camera has seen a curtain, a lidar-only edge
                                             # is never walked through (a wall: curtaintest 25 Nov, W wall 15 lidar spots vs N curtain)
        curtain_wall_switch_ratio: 2.0       # the yellow curtain wall (RViz) moves to an edge with this many times its camera spots
                                             # (fullrun 25 Nov 215528: a grey wall got 6 colour spots early, the real curtain 16 later)
        curtain_lidar_only: false             # no camera spots at all: walk through the lidar-only edge with the most spots (false = never)
        curtain_last: true                   # another reachable tile beside the curtain's tile: explore it first (the tile becomes the
                                             # last split); backtracking returns and walks through the curtain afterwards
        curtain_scan_when_stuck: true        # no reachable tile while tiles are left: curtain_scan first (face each edge of this tile with an
                                             # unvisited tile behind it, look dwell_s), once per tile until a new tile is visited
                                             # (explorer_26_11_221940: boxed in facing a wall, no room for the scan turn, curtain never seen)
        curtain_scan_mode: curtain_scan
        stairs: false                        # use_stairs:=true (launch / explorer.sh --stairs): a staircase tile (stair_detector) shares a
                                             # side with the current tile -> stairs mode: AI mode on, climb over it, AI mode off, wall it off
        stair_min_facing: 0.5                # climb only from a side the steps go up from (cos of ascent vs the way across; 0.5 = 60 deg)
        stairs_when_stuck: true              # nothing reachable left on this side (recoveries exhausted, retried): give up on the tiles
                                             # left and go to the tile in front of the staircase to climb it (false: retry forever)
        stairs_after_retries: 1              # ... after this many retry rounds without reaching a new tile
        stairs_backtrack_attempts: 3         # then no recovery: the tile in front of the staircase becomes the last split and backtracking
                                             # drives there and starts the stairs mode; at most this many times (0 = no limit)
        rollers: false                       # use_rollers:=true (launch / explorer.sh --roller): a roller tile (roller_detector) shares a side
                                             # with the current tile -> roller mode: square up, h-step gait, cross it into the tile beyond
        roller_min_facing: 0.8               # cross only when the roller lies across the way (|cos| of its normal vs the side; 0.8 = 37 deg)
        backtracking: true                   # a tile with two or more tiles to travel to is the 'last split'; when no exploration
        backtracking_mode: backtracking      # target is left but tiles are unexplored, go back there and take the other way (else retry_wait)
        split_on_discovery: true             # a new tile found beside a tile visited earlier (shared side not a wall) makes that
                                             # tile a split again, so backtracking can come back for it
        backtrack_to_nearest_unvisited: true # no split left but tiles are unvisited: the visited tile beside the nearest unvisited tile
                                             # reachable along moves already made becomes the last split (each pair tried once per round)
        classify_target: true                # terrain-classify the target tile as soon as the robot points at it; floor not visible -> choose another tile
        classify_max_angle_deg: 20.0         # "points at it": heading within this angle of the tile
        retry_period_s: 3.0                 # nothing reachable but tiles are left: wait this long, then give every tile another chance
        retry_rescan: true                   # ... after a rescan (new map data may open a Nav2 path)
        retry_clear_costmaps: true
        scan_mode: scanning
        face_away_from_walls: true           # final heading on a tile: N/W/E/S, facing away from the most walls
        on_goal_failed: decide               # decide (pick another tile) | recovery
        on_no_reachable_tile: recovery       # no candidate of any profile has a Nav2 path: recovery | scanning | idle
        no_path_retries: 2                   # no Nav2 path to any tile: wait retry_period_s, rescan and retry this many times before recovery
        quickscan_on_edge: false             # true (or launch arg quickscan_on_edge:=true): stop on a tile edge, run quickscan
        quickscan_edge_margin_m: 0.15        # on the edge = within this distance of a tile boundary (once per tile)
      quickscan:
        type: quickscan
        animation: quickscan                 # animations.py, played by the animation_player node (its quickscan.* parameters)
        settle_s: 0.3                        # stand still this long before the animation starts
        start_timeout_s: 3.0                 # animation_player did not start it: skip
        timeout_s: 30.0                      # cancel an animation that runs longer
        next_mode: exploring                 # a new decision follows (the cancelled goal is re-chosen)
      scene:                                 # scene tile next to the current tile: face it, ask the AI to describe it, mark it explored (never entered)
        type: scene
        next_mode: exploring
        rest_s: 1.5                          # stand still first (a scan spin just before is still coasting)
        center_tol_m: 0.10                   # then drive (vx / vy, heading held) to within this of the current tile's centre ...
        center_timeout_s: 15.0               # (not there by then: face it from where it is) ...
        commit_deg: 150.0                    # ... and only then turn to face the scene tile; target further round than this: keep the turn's direction
        face: back_wall                      # back_wall: square up to the scene tile's back wall (lidar map) so the 3 views spread
                                             # evenly over it; no straight wall found (or face: centre): face the tile's centre
        back_wall_max_deg: 20.0              # back wall turned at most this far from the tile grid ...
        back_wall_beyond_m: 0.4              # ... in the scene tile's far half or up to this past its far edge ...
        back_wall_min_coverage: 0.8          # ... and continuous over at least this share of the tile's middle 0.8 m
        align_tol_deg: 0.5
        align_timeout_s: 15.0
        min_turn_rad_s: 0.02
        max_turn_rad_s: 0.3
        turn_gain: 0.5
        turn_lead_s: 0.6                     # stop the in-place turn this long early (the dog coasts on; fullrun_26_11_210206)
        settle_s: 1.0                        # stand still facing it before the AI looks
        quickscan: true                      # take 3 pictures (body yaws left, centre, right: scenescan animation) instead of one
        animation: scenescan                 # animations.py, played by animation_player (its scenescan.* parameters)
        start_timeout_s: 3.0                 # animation_player did not start it: one picture from where it stands
        timeout_s: 8.0                      # cancel the animation after this long
        llm_attempts: 2                      # AI tries; after the last the tile is marked explored anyway (not in the background: one try)
        background: true                     # once the pictures are taken, go on exploring; the AI's answer is recorded when it comes
      mppi:
        type: mppi                           # stuck in the costmap obstacle zone: nudge the robot out with linear x / y velocity
        next_mode: exploring                 # clear -> decide again
        fail_mode: recovery                  # no way out / timeout / moved too far
        speed_mps: 0.15
        hold_heading: true                   # the heading on entering is held while the robot slides out (wz P-controller)
        heading_kp: 1.5                      # rad/s of wz per rad of heading error
        wz_max: 0.3                          # limit of that correction (rad/s)
        clear_cost: 70                       # clear = the robot's costmap cell is cheaper than this ...
        clear_hold_s: 0.6                    # ... for this long
        search_m: 1.0                        # how far around the robot to look for clear floor
        max_travel_m: 1.0
        timeout_s: 20.0
      curtain_scan:
        type: curtain_scan                   # no reachable tile: turn in place (direct wz, not Nav2 Spin) to face each candidate edge, look, then exploring
        next_mode: exploring
        dwell_s: 3.0                         # stand still facing each edge this long (depth ~1.5-2 Hz, confirm_hits frames per spot)
        align_tol_deg: 10.0
        turn_timeout_s: 12.0                 # the turn to an edge did not finish: look from where it stopped
        min_turn_rad_s: 0.2
        max_turn_rad_s: 0.4
        turn_gain: 1.0
        turn_lead_s: 0.6                     # the dog turns on ~this long after wz drops (Mode.turn_towards)
      curtain:
        type: curtain                        # a curtain along the current tile's edge: go to the tile centre, square up, walk through with vx, go back to exploring
        next_mode: exploring                 # through it (backtracking: back to backtracking); given up: back to the mode that was running before
        center_tol_m: 0.40                  # first drive (turn, then vx / wz: no vy) to within this of the centre of the tile in front of the curtain
        center_drift_m: 0.04                 # centring ends when within 2x the tolerance and this much farther than the closest it got
        center_turn_deg: 30.0                # centring: turn in place while the centre is more than this off the heading
        center_heading_gain: 1.5             # centring: wz per rad of bearing error while driving
        center_speed_mps: 0.15
        center_min_speed_mps: 0.05
        center_gain: 1.0
        center_timeout_s: 15.0               # not there by then: align from where it is
        lateral_gain: 1.0                    # vy that keeps the robot on the line from the tile centre through the edge
        lateral_max_mps: 0.1
        stall_m: 0.05                        # walking through: less progress than this ...
        stall_s: 2.0                         # ... in this long = blocked: a wall (a curtain gives way)
        start_grace_s: 2.0                   # no stall check this long after the cross starts (from standing it takes ~1.5 s to
                                             # get walking: 25 Nov bag, a curtain right in front was called a wall after 2 s)
        blocked_gives_up: true               # blocked = give up on this curtain at once (it was a wall); false: retry up to max_attempts
        timeout_gives_up: true               # cross_timeout_s ran out = give up at once and unmark the edge as a curtain (detection goes on
                                             # elsewhere); false: retry up to max_attempts, unmarked when given up. Blocked unmarks too.
                                             # The initial tile's edges hold no curtain only with tiles.no_curtain_on_initial_tile.
        max_attempts: 3                      # tries (back to the centre, square up, walk) before giving up
        rebase_odom: true                    # through: odom re-anchored at the centre of the tile behind, on the line walked, heading =
                                             # squared-up heading + IMU yaw drift (as stairs rebase_yaw: heading)
        scan_after: true                     # ... then a scan (scan_mode) and the tile is corrected from where SLAM puts the robot
        scan_mode: scanning                  # (not when backtracking walked it: back to backtracking straight away)
        speed_mps: 0.25                      # forward speed (vx) through the curtain
        hstep: true                          # cross only in the h-step gait (rug_hstep, held via /step_up from squared up to through)
        gait_settle_s: 2.0                   # stand still this long after switching h-step on and after releasing it
        align_tol_deg: 5.0                   # square to the edge within this before walking
        align_cross_deg: 30.0                # ... or when the heading swept through the target (error changed sign) within this
        align_timeout_s: 15.0
        min_turn_rad_s: 0.2
        max_turn_rad_s: 0.4                  # was 0.6: in-place turns coasted 20-25 deg past the target (fullrun_26_11_210206)
        turn_gain: 1.0
        turn_lead_s: 0.6                     # the dog turns on ~this long after wz drops: stop that much early (Mode.turn_towards)
        heading_gain: 1.0                    # wz that holds the heading while walking
        extra_m: 0.0                         # stop this much beyond the next tile's centre
        cross_timeout_s: 20.0
        low_move_s: 2.0                      # barely moving (< low_move_m AND < low_move_deg since the reference pose) this long
                                             # while centring / aligning / crossing: stop and go to low_move_mode (0 = off)
        low_move_m: 0.05
        low_move_deg: 3.0
        low_move_grace_s: 2.0                # not judged in the first seconds of each phase (a standing robot takes ~1.5 s to get going)
        low_move_mode: recovery
      stairs:                                # a staircase tile beside the current tile: centre, square up, AI mode on, climb over it with vx
        type: stairs                         # into the tile beyond, AI mode off, wall the staircase off, exploring
        next_mode: exploring
        fail_mode: recovery                  # stuck / timed out after AI mode was on (it is turned off first): recovery
        ai_on_code: "0x21010528"             # /simple_cmd MotionSimpleCMD {cmd_code, type: 0}: enter AI mode
        ai_off_code: "0x2101052B"            # ... leave AI mode
        ai_settle_s: 2.0                     # stand still this long after each AI mode command
        center_tol_m: 0.10                   # first drive (turn, then vx / wz) to within this of the centre of the tile in front of the staircase;
        center_timeout_s: 30.0               # never climb from off-centre: not there by then = give up before AI mode (back to the previous mode)
        align_tol_deg: 5.0                   # square up to the staircase's side within this before AI mode goes on
        align_timeout_s: 15.0                # could not square up: give up (AI mode never turned on), back to exploring
        max_turn_rad_s: 0.4
        turn_lead_s: 0.6                     # stop the in-place turn this long early (the dog coasts on; fullrun_26_11_210206)
        speed_mps: 0.34                      # forward speed (vx) over the stairs
        heading_gain: 1.0                    # wz that holds the heading while climbing
        lateral_gain: 0.5                    # vy that keeps the robot on the line through the tile centres (0 = off)
        lateral_max_mps: 0.08
        extra_m: 0.0                         # stop this much beyond the centre of the tile beyond the staircase
        cross_timeout_s: 20.0                # AI mode on -> level beyond the stairs took ~10.5 s (bag stairs-rebasing_25_11_114524), plus clear_s
        stall_m: 0.05                        # climbing: less progress than this ...
        stall_s: 10.0                        # ... in this long = stuck on the stairs
        pose_lost_s: 3.0                     # no pose on the stairs: keep walking straight this long, then stop
        imu_lost_s: 3.0                      # IMU crossing: no fresh /imu/data this long -> stop (already level beyond the stairs: over them)
        # climber: false = the built-in climb (centre, square up, AI on, vx over the stairs, AI off). true hands it to the separate
        # stair_climber package instead (not used: needs that node running). ai_before_climber / climber_* apply only then.
        # speed_mps / stall_* / cross_timeout_s are used by the built-in climb.
        ai_before_climber: true              # AI mode on after centring + squaring up (flat gait, live pose; leg odom freezes in AI mode),
                                             # before stair_climber: its lidar alignment and walk run in AI mode, no second Enter AI
        scan_after: true                     # after the climb: a scan (scan_mode), then the tile the robot is on is corrected from where SLAM puts it
        scan_mode: scanning
        new_map: false                       # OPTIONAL. true: once the staircase is cleared, save the map so far (map_<run>_part<n>.pgm/.yaml, _tiles.json, tile report)
                                             # under reports_dir, clear the map (slam_toolbox is restarted, launch respawns it) and start a new one: the tile
                                             # beyond the stairs is the new start tile, with the virtual wall behind it against the staircase. Needs scan_mode.
                                             # A failed save / restart keeps the old map. Detectors forget the old map's stairs (/map_reset).
        new_map_dir: ''                      # '' = reports_dir
        new_map_timeout_s: 60.0              # save + restart longer than this: give up, keep the old map
        rebase_odom: true                    # after the climb: odom is re-anchored at the centre of the reference tile beyond the staircase
                                             # (one tile past it along the steps, turned to the stair direction, not the grid) (/odom_rebase)
        rebase_yaw: heading                  # rebase pose: heading (on the line walked, squared-up heading + IMU yaw drift) or stairs (snap to the reference tile, up the steps)
        climber: false                      # built-in climb in this mode (centre, square up, AI on, vx over the stairs, AI off); no stair_climber node
        climber_search_timeout_s: 15.0       # still searching after this long: the lidar does not see stairs, give up (no climb)
        climber_timeout_s: 180.0             # whole climb, alignment included
        climber_lost_s: 5.0                  # no /stair_climber/state for this long: the node is not running, give up
      roller:                                # a roller tile beside the current tile: square up to it, h-step gait (/step_up), cross it with vx
        type: roller                         # into the tile beyond, terrain gait again, the roller tile is marked explored, exploring
        next_mode: exploring
        fail_mode: recovery                  # gave up with the robot past the edge (at / on the roller): recovery; before it: the mode before
        gait_settle_s: 2.0                   # stand still this long after switching to the h-step gait (and after switching back)
        center_tol_m: 0.10                   # first drive (turn, then vx / wz) to within this of the centre of the tile in front of the roller
        center_timeout_s: 15.0
        align_tol_deg: 4.0                   # square up to the roller within this before stepping over it
        approach_angle_deg: -90.0             # approach with the body this far off the roller plane (+ = turned left) while vx / vy walk the straight line through the tile centres ...
        approach_until_m: 0.0                # ... until the robot reaches the roller tile's edge line (progress past it, in m); then it squares up and crosses
        align_timeout_s: 15.0                # could not square up: give up (never crossed), back to exploring
        max_turn_rad_s: 0.4
        turn_lead_s: 0.6                     # stop the in-place turn this long early (the dog coasts on; fullrun_26_11_210206)
        speed_mps: 0.20                      # forward speed (vx) over the roller
        heading_gain: 1.0                    # wz that holds the heading while crossing
        lateral_gain: 0.5                    # vy that keeps the robot on the line through the tile centres (0 = off)
        lateral_max_mps: 0.08
        extra_m: 0.0                         # stop this much beyond the centre of the tile beyond the roller
        recenter: true                       # at the edge after the roller tile: stop, recentre on its midpoint with omni vx / vy / wz, then go on
        recenter_tol_m: 0.06
        recenter_speed_mps: 0.08
        recenter_gain: 0.8
        recenter_timeout_s: 8.0              # not there by then: cross on from where it is
        restore_heading: true                # at that midpoint also set the yaw setpoint to the mission's original heading (square to the roller when unknown); it is held to the end
        restore_max_deg: 100.0               # ... unless that is further than this from the way across (crossing back over a roller)
        recenter_yaw_tol_deg: 5.0            # recentring ends when the heading is within this of the setpoint too
        cross_timeout_s: 40.0
        stall_m: 0.05                        # crossing: less progress than this ...
        stall_s: 6.0                         # ... in this long = stuck at the roller: back off and try again
        max_attempts: 2                      # crossing tries (back off, square up again, cross) before giving up
        back_speed_mps: 0.12
        back_timeout_s: 10.0
        pose_lost_s: 3.0                     # no pose while crossing: keep walking straight this long, then stop
      backtracking:                          # no target left: back to the last split tile, on to its untravelled tile, then exploring
        type: backtracking
        traversal: route                     # NavigateThroughPoses through the tile centres of the way back (a nav2_route profile)
        waypoints_per_tile: 3                # per tile-to-tile hop: waypoints evenly spaced on the straight line between the two centres
        align_at_tiles: true                 # yaw setpoint per tile: at each tile centre turn in place to face the next tile, then drive that hop
        align_tol_deg: 5.0
        align_timeout_s: 15.0                # not facing it by then: drive on anyway
        align_settle_s: 0.6                  # squared up: stand still this long before Nav2 drives the hop (it took over mid-coast)
        min_turn_rad_s: 0.2
        max_turn_rad_s: 0.4                  # was 0.6: in-place turns coasted 20-25 deg past the target (fullrun_26_11_210206)
        turn_gain: 1.0
        turn_lead_s: 0.6                     # the dog turns on ~this long after wz drops: stop that much early (Mode.turn_towards)
        min_clearance_m: 0.25
        path_check_timeout_s: 10.0
        goal_timeout_s: 30.0
        face_away_from_walls: true
        scan_after_reach: true               # scan on the new tile (scanning hands over to exploring)
        scan_mode: scanning
        next_mode: exploring
      recovery:
        type: recovery
        traversal: recovery_mppi             # Nav2 with the holonomic RecoveryMPPI controller (strafes with vx / vy)
        fallback_traversal: omni             # that failed: straight linear x / y velocity to the same tile centre ('' = none)
        keep_gait: true                      # keep the gait the robot already has (gait_switcher /gait_freeze): no switch for
                                             # the recovery targets or a new terrain until recovery ends
        step_up_gait: true                   # ... but a recovery target higher than the robot's tile still switches to the
                                             # h-step gait (the top-level step_up_gait rule; false = frozen for step ups too)
        candidates: 3                        # nearest centres tried in turn
        min_distance_m: 0.25                 # skip the centre the robot is already on
        adjacent_only: true                  # prefer the robot's own tile / tiles sharing a side with it; none explored -> nearest explored tile anywhere
        min_clearance_m: 0.35
        attempt_timeout_s: 10.0
        clear_costmaps: true
        clear_settle_s: 1.0
        give_up_after: 3                     # recoveries in a row without a new tile -> give up on the failing tiles
        next_mode: scanning
        fail_mode: scanning
      ending:                                # end condition ending_tile: drive to the ending tile's centre, then complete
        type: ending
        traversal: direct                    # NavigateToPose to the centre
        fallback_traversal: omni             # failed / stopped off-centre: straight x / y velocity to the centre ('' = none)
        centre_tolerance_m: 0.10             # Nav2 arrived further than this from the centre: finish with fallback_traversal
        attempt_timeout_s: 60.0
        give_up_after: 0                     # failed visits (each followed by a rescan) before completing anyway; 0 = never
        fail_mode: scanning
      complete:
        type: complete
