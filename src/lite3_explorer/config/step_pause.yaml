step_pause_gate:
  ros__parameters:
    # Balance pauses while Nav2 drives the robot up onto a higher tile (/step_up true from the mission manager). The node sits
    # between Nav2's velocity smoother and /cmd_vel (exploration.launch.py step_pause:=true) and sends zero velocity for
    # pause_s at each of pause_offsets_s, counted from when the nose tilts up the step. step_pause:=false = no gate at all
    # (neither the pauses nor the h-step gait wait below).
    enabled: true                   # false: plain relay (the gate stays in the /cmd_vel path)
    pause_offsets_s: [0.0, 0.7]     # seconds after the climb tilt: front legs going up, then the rear legs ([0.0] = one pause)
    pause_s: 0.2                    # length of each pause
    climb_start_deg: 6.0            # nose up beyond this ...
    tilt_hold_s: 0.1                # ... for this long = stepping up
    level_deg: 3.0                  # |nose| below this ...
    rearm_s: 1.0                    # ... for this long after a climb = on top; the next tilt (another step) pauses again
    nose_up_sign: -1.0              # ROS pitch is + nose DOWN (same as modes.stairs.nose_up_sign)
    imu_topic: /imu/data
    imu_max_age_s: 0.5              # older IMU = no pauses
    step_up_topic: /step_up
    driving_timeout_s: 0.3          # pause only while Nav2 sent a non-zero command this recently (curtain / roller modes
                                    # also set /step_up but drive /cmd_vel themselves)
    # h-step gait wait: from /step_up going on, hold the robot (zero velocity) until /robot_state reports the h-step gait,
    # so it never drives onto the step in the flat gait (fullrun_26_11_120359: entered tile -2,-2 before the switch).
    wait_for_hstep: true
    hstep_state: 13                 # robot_gait_state of RUG H-step (robot_state.GAIT_STATE_BY_CODE[0x21010407])
    gait_wait_max_s: 4.0            # give up holding after this long (no /robot_state, gait refused) so stuck / recovery
                                    # can act (keep it under stuck detection's 5 s); 0 = wait for ever
    robot_state_topic: /robot_state
    robot_state_max_age_s: 1.0      # older robot state = gait unknown (keeps holding until gait_wait_max_s)
