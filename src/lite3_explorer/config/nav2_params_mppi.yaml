# Nav2 (ROS 2 Humble) parameters for the DEEP Robotics Lite3 doing tile exploration (lite3_explorer): MPPI HOLONOMIC
# controller variant. Identical to nav2_params.yaml except controller_server.FollowPath (MPPI, Omni motion model),
# min_y_velocity_threshold and the velocity smoother's vy limits. Select it with  controller:=mppi.
# Speeds are deliberately low for uneven terrain tiles. Footprint is approx. Lite3 body
# (0.61 m x 0.37 m) plus a small margin - measure your robot and adjust.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # plugin_lib_names: Humble's built-in default list is used

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001      # MPPI strafes: vy must not be thrown away (the pure pursuit never commands it)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0               # controller patience: seconds without a valid command before the goal is aborted
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "RecoveryMPPI"]   # RecoveryMPPI: the recovery mode's controller
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # A tile counts as reached when the robot is within tile_reach_radius_m (reporter.yaml, 0.30 m) of its
      # centre, and the tile goal is the centre, so Nav2 must stop closer than that. Keep this below
      # tile_reach_radius_m (it was 0.45 m, which can end up 0.45 m from the centre: not reached).
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.60
    # ---- MPPI (Model Predictive Path Integral), HOLONOMIC: it commands vx, vy and wz (the Lite3 takes all three on
    # /cmd_vel), so it can strafe sideways and turn while moving instead of only driving forward like the pure pursuit.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28                     # horizon = time_steps * model_dt = 2.8 s
      model_dt: 0.1                      # MUST equal the controller period (1 / controller_frequency = 0.1 s)
      batch_size: 2000                   # sampled trajectories per cycle (lower it if the controller misses its rate)
      iteration_count: 1
      motion_model: "Omni"               # DiffDrive | Omni | Ackermann: Omni = holonomic, vy is sampled too
      # speed limits (m/s, rad/s); the velocity smoother below uses the same
      vx_max: 0.2
      vx_min: -0.2
      vy_max: 0.3
      wz_max: 0.3                        # low on purpose: lateral moves keep the heading (was 0.6)
      # sampling noise: how far the samples spread around the current best control
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.1                        # samples barely rotate (was 0.4)
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.7                # path length ahead that is optimised
      transform_tolerance: 1.0           # map->odom can trail the robot pose by up to ~1 s (lidar lag, see slam_toolbox.yaml)
      regenerate_noises: true
      visualize: true                    # /trajectories (MarkerArray) in RViz: the sampled and the chosen path
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # The cost terms, in order. Holonomic and heading-holding: no PreferForwardCritic and no PathAngleCritic (in this
      # Nav2 it turns the robot to face the path; Humble has no 'mode' parameter), TwirlingCritic penalises rotation, so
      # the robot sidesteps with vy and keeps its heading.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true         # the 0.61 x 0.37 m body, not a circle: it fits narrow gaps sideways
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0                # raise it if the heading still drifts, lower it if the robot cannot turn when it must
    # ---- RecoveryMPPI: the same holonomic (Omni) MPPI, used by the mission's RECOVERY mode only (traversal profile
    # recovery_mppi -> behavior_trees/recovery_mppi.xml, FollowPath controller_id="RecoveryMPPI"). It strafes with vx / vy
    # back to the chosen tile centre, holding the heading.
    RecoveryMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28                     # horizon = time_steps * model_dt = 2.8 s
      model_dt: 0.1                      # MUST equal the controller period (1 / controller_frequency = 0.1 s)
      batch_size: 2000                   # sampled trajectories per cycle (lower it if the controller misses its rate)
      iteration_count: 1
      motion_model: "Omni"               # DiffDrive | Omni | Ackermann: Omni = holonomic, vy is sampled too
      # speed limits (m/s, rad/s); the velocity smoother below uses the same
      vx_max: 0.4
      vx_min: -0.2
      vy_max: 0.3
      wz_max: 0.3                        # low on purpose: lateral moves keep the heading (was 0.6)
      # sampling noise: how far the samples spread around the current best control
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.1                        # samples barely rotate (was 0.4)
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.7                # path length ahead that is optimised
      transform_tolerance: 1.0           # map->odom can trail the robot pose by up to ~1 s (lidar lag, see slam_toolbox.yaml)
      regenerate_noises: true
      visualize: true                    # /trajectories (MarkerArray) in RViz: the sampled and the chosen path
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # The cost terms, in order. Holonomic and heading-holding: no PreferForwardCritic and no PathAngleCritic (in this
      # Nav2 it turns the robot to face the path; Humble has no 'mode' parameter), TwirlingCritic penalises rotation, so
      # the robot sidesteps with vy and keeps its heading.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true         # the 0.61 x 0.37 m body, not a circle: it fits narrow gaps sideways
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0                # raise it if the heading still drifts, lower it if the robot cannot turn when it must

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Body size (0.61 m x 0.37 m) with no padding, so the spin's collision check
      # does not treat walls a few centimetres away as contact.
      footprint: "[[0.305, 0.185], [0.305, -0.185], [-0.305, -0.185], [-0.305, 0.185]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        # Minimum clearance from walls: the Spin behaviour checks this costmap, and a larger
        # inflation makes the walls of a 1 m tile look like collisions while turning.
        inflation_radius: 0.1
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Frontier goals sit next to unknown space: keep unknown cells traversable
      track_unknown_space: true
      footprint: "[[0.34, 0.21], [0.34, -0.21], [-0.34, -0.21], [-0.34, 0.21]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan virtual_walls
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
        # virtual walls (tile edges that are mostly wall + the wall behind the start), published by mission_manager
        virtual_walls:
          topic: /virtual_walls
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.1
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.4
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    # Seconds of rotation simulated ahead by Spin (was 2.0: the 0.61 m body swept against the walls of a 1 m
    # tile and "Collision Ahead - Exiting Spin" aborted the scan turns).
    simulate_ahead_time: 0.4
    # Spin = the scan turns (the opening sweep and the turn at every stop). Slow: at 1.0 rad/s the robot turned ~50 deg/s,
    # 7-14 deg between scans, and slam_toolbox's map->odom swung by up to 20 deg during the opening sweep (bag
    # stairs-rebasing_25_11_113541; leg odom / IMU / gyro agreed throughout), so the walls round the start tile were
    # mapped several times at different angles and the tile grid could not line up with them. At 0.35 rad/s (20 deg/s)
    # it is ~3-5 deg between scans. The opening sweep (480 deg in all) takes ~25 s instead of ~9 s; the longest single
    # turn (240 deg) ~12 s, inside the scanning mode's time_allowance_s (20 s).
    max_rotational_vel: 0.35
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false              # never pause at the waypoints between tiles
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Lite3 accepts vx, vy, wz on /cmd_vel; MPPI (holonomic) uses all three.
    max_velocity: [0.4, 0.3, 0.3]
    min_velocity: [-0.2, -0.3, -0.3]
    max_accel: [0.6, 0.5, 1.5]
    max_decel: [-0.8, -0.5, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
