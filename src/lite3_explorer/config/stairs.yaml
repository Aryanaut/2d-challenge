stair_detector:
  ros__parameters:
    # Finds staircases in the depth image: flat treads at evenly spaced heights, each farther away than the one below (the
    # 2D lidar only sees the risers, as a wall). Optional: use_stairs:=true on exploration.launch.py. The mission manager's
    # 'stairs' mode climbs over a staircase tile beside the current tile in the robot's AI mode (config/mission.yaml:
    # modes.stairs). Tuned on bags/data/stairs (metal staircase, ~13 cm rise, ~25 cm treads).
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    depth_hfov_deg: 81.4        # only until camera_info arrives
    depth_scale: 0.001          # 16UC1 millimetres -> metres
    global_frame: map           # its z axis must point up
    process_hz: 2.0             # LOW rate: depth frames processed per second
    pause_topic: /ai_mode       # paused while the robot climbs in AI mode
    stride: 4                   # use every 4th pixel
    min_range_m: 0.25           # horizontal distance from the camera
    max_range_m: 2.5
    cell_m: 0.05                # height-map cell
    min_cell_points: 3
    flat_std_m: 0.015           # a cell is flat (tread / floor) when its heights spread less than this
    level_gap_m: 0.03           # neighbouring flat cells closer in height than this are one level ...
    link_cells: 2               # ... 'neighbouring' = at most this many cells apart (bridges reflection holes)
    max_level_span_m: 0.08      # a level thicker than this is a slope, not a tread
    min_level_cells: 10
    min_rise_m: 0.07            # height of one step
    max_rise_m: 0.25
    min_run_m: 0.10             # each tread starts at least this much farther away than the one below ...
    max_gap_m: 0.35             # ... and no farther than this past where the one below ends
    min_levels: 3               # floor + two treads at least (a box on the floor is only two levels)
    floor_near_m: 0.6           # floor height = the lowest big level starting this close to the camera ...
    floor_min_cells: 25
    floor_window: 40            # ... over the last 40 frames ...
    floor_quantile: 0.2         # ... at this quantile (treads are always above the floor)
    map_cell_m: 0.10            # remembered stair cells
    confirm_hits: 3             # a stair cell counts after this many sightings
