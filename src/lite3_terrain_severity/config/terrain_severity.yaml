terrain_severity:
  ros__parameters:
    points_topic: /terrain_classifier/lidar_points   # needs publish_debug_clouds: true on terrain_classifier
    height_field: intensity                          # = height above the fitted ground plane
    terrain_topic: /terrain_type
    imu_topic: /imu/data
    odom_topic: /leg_odom2
    cmd_in: /cmd_vel_raw        # remap Nav2 / frontier explorer output to this
    cmd_out: /cmd_vel
    use_governor: false         # false = only report. Turn on with: use_governor:=true (Step 6)
    use_imu: true
    use_slip: true
    rate_hz: 20.0
    points_max_age_s: 1.0
    cmd_timeout_s: 0.5
    imu_window_s: 1.5

    severity:
      lookahead_m: 1.2
      half_width_m: 0.28
      x_start_m: 0.30
      #            mild   moderate severe extreme
      edge_m:      [0.03, 0.06,  0.10,  0.15]
      bump_m:      [0.04, 0.08,  0.12,  0.18]
      hole_m:      [0.04, 0.07,  0.11,  0.16]
      roughness_m: [0.012, 0.025, 0.045, 0.07]
      rough_area:  [0.05, 0.15,  0.30,  0.50]
      imu_std_deg: [1.5,  3.0,   5.0,   8.0]
      slip_mps:    [0.10, 0.20,  0.30,  0.45]
      extreme_within_m: 0.70
      roll_alarm_deg: 18.0
      pitch_alarm_deg: 30.0     # keep above your steepest ramp
      non_rugged_cap: 1
      unknown_level: 2

    governor:
      #             smooth mild moderate severe extreme
      speed_factor: [1.0,  0.7, 0.45,    0.25,  0.0]
      creep_factor: 0.15
      pause_s: 1.5
      creep_s: 2.0
      max_pauses: 3
      down_hold_s: 1.0
      factor_rise_per_s: 0.5
      turn_exponent: 0.5
      min_turn_factor: 0.3
