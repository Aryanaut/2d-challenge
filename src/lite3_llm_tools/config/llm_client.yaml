llm_client:
  ros__parameters:
    # ---- AI perception server (POST /analyze: group_id, prompt, image) ----
    server_url: "http://192.168.10.141:8000"   # LAN address of the AI server
    group_id: "group01_s3xy"                # your group id (quote it: a bare number is a YAML integer)
    read_timeout_s: 75.0
    connect_timeout_s: 5.0
    connect_retries: 3            # per request, on connect errors / HTTP 429,502,503,504 (all AI calls)
    connect_backoff_s: 2.0        # first wait; doubles each retry (2, 4, 8 s)
    # ---- context: camera + lidar ----
    image_topic: /camera/color/image_raw/compressed   # Orbbec front colour camera (JPEG)
    image_compressed: true                            # set false for /camera/color/image_raw
    max_image_width: 1024         # the server rejects images larger than 1024x768: everything sent is shrunk to fit
    max_image_height: 768
    jpeg_quality: 85
    image_wait_s: 5.0             # capture_view waits at most this long for a new camera frame
    map_topic: /map               # SLAM map built from the lidar, drawn top-down for the AI
    scan_topic: /scan             # lidar ranges, summarised as a line of text in the prompts
    scan_forward_offset_deg: 0.0  # scan angle that points forward on the robot
    scan_max_age_s: 2.0
    lidar_context: true           # false = do not add the lidar ranges to the prompts
    min_wall_clearance_m: 0.35    # red band next to walls in the map image, and told to the AI
    target_min_clearance_m: 0.30  # told to the AI when it chooses a tile
    # ---- behaviour ----
    query_retries: 1              # extra attempts per camera view if the server fails
    error_backoff_s: 5.0          # wait before such a retry (Retry-After header wins if longer)
    view_query_workers: 3         # views of one stop sent to the server at once
    request_workers: 4            # requests served at once
    output_dir: "~/lite3_survey_runs"   # images + answers, unless a request names its own save_dir
    # ---- scene references (describe_scene) ----
    # Photos named <scene_type>_<n>.jpg. The live frame is sent in one collage with them and only their scene types
    # can be answered: anything else becomes "traversable". "" = no references (the 8 fixed scene types).
    scene_references_dir: "~/2d/images/scene_references"
    scene_min_confidence: 0.0     # a scene answer below this confidence -> traversable (0 = off)
    # ---- prompts (empty = share/lite3_llm_tools/prompts/<default>) ----
    prompt_file: ""                      # environment_report.txt   (describe_views)
    describe_view_prompt_file: ""
    describe_tile_prompt_file: ""        # tile_report.txt         (describe_tile: what a tile looks like)
    place_initial_tile_prompt_file: ""   # tile_init.txt
    choose_tile_prompt_file: ""          # tile_choice.txt
    choose_frontier_prompt_file: ""      # frontier_choice.txt
    describe_scene_refs_prompt_file: ""  # scene_reference_report.txt (describe_scene with scene_references_dir)
