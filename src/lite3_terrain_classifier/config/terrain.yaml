terrain_classifier:
  ros__parameters:
    base_frame: base_link
    odom_frame: odom              # used to stack lidar frames while walking; "" = never stack
    terrain_topic: /terrain_type  # std_msgs/String: rugged | non_rugged | unknown
    rate_hz: 5.0
    confirm_frames: 3             # the same new label must be seen this many ticks in a row
    # lidar_primary      lidar decides, the camera only marks it verified (details topic)
    # require_agreement  only change state when lidar and camera agree
    # any_rugged         rugged if either sensor says rugged (most cautious)
    fusion_mode: lidar_primary
    depth_fallback: true          # use the camera alone when the lidar has no usable data
    use_depth: true
    publish_debug_clouds: true    # ~/lidar_points, ~/depth_points (intensity = height above ground plane)
    start_enabled: true
    trigger_mode: false           # true: classify only on ~/classify (once at startup too), then hold the label
    trigger_duration_s: 1.5       # trigger_mode: how long each triggered run lasts (>= confirm_frames / rate_hz)

    lidar:
      topic: /livox/points        # Livox MID-360 PointCloud2 (xfer_format 0)
      accumulate_s: 0.3           # stack this much lidar history (MID-360 frames are sparse)
      max_age_s: 1.0
      # Area checked, metres in base_link (x forward, y left, z up)
      x_min: -1.5
      x_max: 2.5
      y_min: -1.5
      y_max: 1.5
      z_min: -1.0
      z_max: 0.4
      # The robot's own body / legs, cut out of the area above
      body_x_min: -0.45
      body_x_max: 0.45
      body_y_min: -0.30
      body_y_max: 0.30
      # Roughness test (see terrain_core.py)
      cell_size_m: 0.30
      min_points_per_cell: 6
      step_height_m: 0.7         # a cell whose ground sits this far above/below the main plane is rugged
      cell_spread_m: 0.08         # ... or whose heights spread this much (p90 - p10); 0 = off
      obstacle_height_m: 0.35     # cells taller than this are obstacles (walls, boxes), ignored
      min_rugged_cells: 4
      min_rugged_fraction: 0.02   # of all terrain cells in the area
      max_tilt_deg: 0.0           # > 0 also calls a tilted plane (ramp) rugged; needs a correct lidar TF
      min_points: 200
      min_cells: 8
      max_points: 6000
      ransac_iterations: 60
      ransac_tolerance_m: 0.03
      max_plane_tilt_deg: 35.0

    depth:
      image_topic: /camera/depth/image_raw      # 16UC1 (mm) or 32FC1 (m)
      info_topic: /camera/depth/camera_info
      mm_scale: 0.001
      # The camera is pitched down: only the bottom half of the frame sees the ground ahead.
      roi_top_fraction: 0.5       # ignore rows above this fraction of the height
      roi_bottom_margin: 0.0
      roi_side_margin: 0.05
      stride: 4                   # use every Nth pixel
      min_range_m: 0.25
      max_range_m: 2.0            # depth noise grows with range
      max_age_s: 1.0
      # With a TF base_link <- camera frame the points are checked in base_link (crop box below
      # and the tilt test work). Without it the check runs in the camera frame, which still works.
      use_tf: true
      x_min: 0.0
      x_max: 2.5
      y_min: -1.5
      y_max: 1.5
      z_min: -1.0
      z_max: 0.4
      cell_size_m: 0.20
      min_points_per_cell: 10
      step_height_m: 0.05
      cell_spread_m: 0.10
      obstacle_height_m: 0.35
      min_rugged_cells: 4
      min_rugged_fraction: 0.02   # of all terrain cells in the area
      max_tilt_deg: 0.0
      min_points: 300
      min_cells: 8
      max_points: 6000
      ransac_iterations: 60
      ransac_tolerance_m: 0.03
      max_plane_tilt_deg: 35.0
