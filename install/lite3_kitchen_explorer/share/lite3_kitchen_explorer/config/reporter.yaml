environment_reporter:
  ros__parameters:
    # ---- AI (provided by the lite3_llm_tools llm_client node; server, camera and prompts are set in its llm_client.yaml) ----
    use_ai: true                  # false = no tile descriptions (the tile report still lists every tile reached)
    llm_report_timeout_s: 180.0   # a tile description that takes longer than this is marked failed
    llm_timeout_s: 120.0          # only used when the AI makes the choices below
    # ---- the tile report: what each tile looks like, one markdown file for the whole run ----
    reports_dir: "~/2d/reports"   # tile_report_<run>.md, rewritten after every change
    tile_reach_radius_m: 0.30     # a tile is reached when the robot is this close to its centre
    # ---- 1 m tile system (set up before exploring starts) ----
    tiles_enabled: true           # build the tile grid + trail; exploration starts after the first tile
    tile_size_m: 1.0
    tile_ai_choice: false         # true = the AI picks the initial tile placement (false = snap to the walls)
    tile_wait_s: 30.0             # max wait for the map around the start before placing the tile
    tile_targets_first: true      # at each stop go to the nearest connected unvisited tile
                                  # (frontiers are only used when no unvisited tile is connected)
    tile_target_ai_choice: false  # true = the AI confirms the nearest tile (false = always take the nearest)
    tile_target_limit: 6          # nearest connected tiles offered to the AI
    target_min_clearance_m: 0.30  # skip tiles with no point this far from walls
    # ---- what happens at each stop ----
    turn_at_stop: true            # one quick turn in place at every stop (and at the start) so the lidar maps around the tile
    turn_deg: 360.0               # how far to turn (relative, + = left); no AI query waits for it
    start_sweep_deg: 90.0         # opening scan at the start: turn from -90 to +90 deg in flat_slow (ignores turn_deg)
    opening_spin_retries: 2       # an aborted opening sweep ("Collision Ahead") is retried the other way this many times
    turn_time_allowance_s: 20.0   # Nav2 gives up on the turn after this long and the next tile is chosen anyway
    turn_check_room: true         # only turn where the body fits: checked on the local costmap like Nav2's Spin does (see below)
    robot_length_m: 0.61          # body size used by that check (match local_costmap footprint in nav2_params.yaml)
    robot_width_m: 0.37
    turn_room_margin_m: 0.0       # extra clearance required around the body while turning
    local_costmap_topic: /local_costmap/costmap
    turn_use_crawl: true          # crawl gait for the turn (gait_switcher via /spin_crawl); false = turn in the walking gait
    crawl_settle_s: 1.0           # wait this long after asking for the crawl gait before turning
    report_at_start: true         # decide the first target at the start (no looking around)
    start_wait_s: 60.0            # max wait for TF / explorer / AI client before starting
    # ---- optional: the AI chooses the next frontier from a map image (avoiding walls) ----
    ai_frontier_choice: false     # true = the AI picks frontiers; false = explorer picks by distance/size cost only
    min_wall_clearance_m: 0.35    # drawn as the red band next to walls in the AI's map image
    choice_min_candidates: 2      # don't ask the AI when there is only one option
    candidates_max_age_s: 3.0
    # ---- frames / wiring ----
    global_frame: map
    robot_frame: base_link
    explorer_service: /frontier_explorer/set_active
    output_dir: "~/lite3_survey_runs"
